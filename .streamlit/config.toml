# Tema claro fijo. Los graficos de cascada se generan con matplotlib sobre fondo
# blanco, de modo que dejar el tema al criterio del navegador haria aparecer un
# recuadro blanco sobre fondo oscuro. Fijarlo aqui garantiza la misma
# presentacion en local y en Streamlit Community Cloud.
[theme]
base = "light"
primaryColor = "#1f4e79"

[browser]
gatherUsageStats = false
